<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4BF52"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E771B"/>
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E2231"/>
      <stop offset="100%" stop-color="#580B14"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="235" fill="#FAF8F5" stroke="#580B14" stroke-width="14" />
  
  <!-- Inner Circular Monogram Frame -->
  <circle cx="250" cy="180" r="90" fill="none" stroke="#580B14" stroke-width="5" stroke-dasharray="500" stroke-dashoffset="30" />

  <!-- Bar Chart Accent inside Monogram -->
  <rect x="215" y="145" width="14" height="25" rx="3" fill="url(#goldGrad)" />
  <rect x="235" y="132" width="14" height="38" rx="3" fill="url(#goldGrad)" />
  <rect x="255" y="118" width="14" height="52" rx="3" fill="url(#goldGrad)" />
  <!-- Growth Arrow -->
  <path d="M265 135 L285 115 M285 115 H273 M285 115 V127" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- VVA Monogram Text -->
  <text x="195" y="198" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0F172A">V</text>
  <text x="234" y="198" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="url(#goldGrad)">V</text>
  <text x="272" y="198" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0F172A">A</text>

  <!-- Main Title: VITTA VIDHI -->
  <text x="250" y="325" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="bold" letter-spacing="4" fill="#580B14" text-anchor="middle">VITTA VIDHI</text>

  <!-- Sub-Title: - ADVISORS - -->
  <path d="M 120 348 L 190 348 M 310 348 L 380 348" stroke="#D4AF37" stroke-width="2.5" />
  <text x="250" y="356" font-family="'Times New Roman', Georgia, serif" font-size="22" font-weight="bold" letter-spacing="8" fill="#D4AF37" text-anchor="middle">ADVISORS</text>

  <!-- Divider Line -->
  <line x1="140" y1="380" x2="360" y2="380" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Tagline Text -->
  <text x="250" y="405" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#1E293B" text-anchor="middle">TAX  |  COMPLIANCE  |  BUSINESS ADVISORY</text>
</svg>
